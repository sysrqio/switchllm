# switchllm sample configuration
server:
  port: 8080

routing:
  # Complexity score >= threshold routes to premium model
  threshold: 0.35
  simple_model: gpt-4o-mini
  premium_model: gpt-4o

providers:
  openai:
    base_url: https://api.openai.com/v1
  anthropic:
    base_url: https://api.anthropic.com/v1

# Keyword hints that increase complexity score (case-insensitive)
complexity_keywords:
  - analyze
  - architecture
  - refactor
  - security
  - prove
  - theorem
  - multi-step
  - debug
  - optimize
