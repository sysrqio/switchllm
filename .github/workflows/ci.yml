name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (offline)
        run: go test ./... -count=1 -race
      - name: Build
        run: go build -o /tmp/switchllm ./cmd/switchllm
